id = "herdr-agent-usage"
name = "Agent Usage"
version = "0.2.0"
min_herdr_version = "0.8.0"
description = "Subscription usage and reset times for the focused Claude Code, Codex, or Antigravity pane."
platforms = ["macos", "linux"]

[[actions]]
id = "configure"
title = "Agent Usage: set up statusLine, tab bar, and keybinding"
contexts = ["workspace"]
command = ["bash", "bin/herdr-agent-usage", "configure"]

[[actions]]
id = "uninstall"
title = "Agent Usage: remove statusLine and config entries"
contexts = ["workspace"]
command = ["bash", "bin/herdr-agent-usage", "uninstall"]

[[panes]]
id = "dashboard"
title = "Agent usage"
placement = "overlay"
command = ["bash", "bin/herdr-agent-usage", "dashboard"]
